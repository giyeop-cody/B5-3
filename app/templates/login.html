{% extends "base.html" %}

{% block title %}로그인 - 게시판 서비스{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2 class="text-center mb-3">로그인</h2>
    
    {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
    {% endif %}
    
    <form action="/login" method="post">
        {# #2: 로그인 후 원래 페이지로 복귀하기 위한 hidden field #}
        {% if next_url %}
            <input type="hidden" name="next_url" value="{{ next_url }}">
        {% endif %}
        
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;" aria-label="로그인">로그인</button>
    </form>
    
    <div class="mt-3 text-center" style="color: #7f8c8d; font-size: 0.9rem;">
        <p>테스트 계정</p>
        <p><strong>ID:</strong> testuser &nbsp; <strong>PW:</strong> test1234</p>
    </div>
</div>
{% endblock %}
