{% extends "base.html" %}

{% block title %}새 글 작성{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2 class="mb-3">✍️ 새 글 작성</h2>
    
    {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
    {% endif %}
    
    <form action="/posts/new" method="post">
        <div class="form-group">
            <label for="board_id">게시판</label>
            <select id="board_id" name="board_id" required>
                <option value="">게시판을 선택하세요</option>
                {% for board in boards %}
                    <option value="{{ board.id }}" {% if selected_board_id == board.id %}selected{% endif %}>
                        {{ board.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" required
                   value="{{ title or '' }}" maxlength="200">
        </div>
        
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content">{{ content or '' }}</textarea>
        </div>
        
        <div class="flex flex-gap">
            <button type="submit" class="btn btn-success">작성 완료</button>
            <a href="/boards" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
{% endblock %}
